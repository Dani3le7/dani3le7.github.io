<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Benvenuto</title>
    <style>
        :root {
            --bg: #eef2f7;
            --surface: #ffffff;
            --ink: #14213d;
            --muted: #5b6785;
            --accent: #2f5bea;
            --border: #d9e0ec;
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1626;
                --surface: #172036;
                --ink: #e8edf8;
                --muted: #9aa7c4;
                --accent: #7a9bff;
                --border: #26314d;
                color-scheme: dark;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 520px;
            padding: 56px 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        h1 {
            font-size: clamp(2.2rem, 7vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        p {
            margin-top: 14px;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 32px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .dot {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Benvenuto.</h1>
        <p>Sito a scopo di test e sviluppo.</p>
        <div class="status"><span class="dot"></span>Work (always) in progress</div>
    </main>
</body>

</html>
